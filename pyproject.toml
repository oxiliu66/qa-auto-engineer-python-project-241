[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "g.nikolaev", email = "mendeleev8@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[tool.uv.build-backend]
module-name = "gendiff"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.coverage.report]
fail_under = 80

[tool.sonar]
projectKey = "oxiliu66_qa-auto-engineer-python-project-241"
organization = "oxiliu66"
sources = "src"
tests = "tests"
python.coverage.reportPaths = "coverage.xml"